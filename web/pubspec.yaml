name: eventhub_web
description: "EventHub Club Leader & Admin Flutter Web Application"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_app_check: ^0.5.1
  firebase_analytics: ^13.0.1
  firebase_remote_config: ^7.0.1
  cloud_firestore: ^7.1.0
  crypto: ^3.0.8
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.9
  eventhub_core:
    path: ../packages/core
  http: ^1.6.0
  firebase_ai: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
