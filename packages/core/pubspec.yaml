name: eventhub_core
description: "Shared Design System, Models, Widgets, Contracts and Utils for EventHub"
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.3
  cloud_firestore: 7.1.0
  firebase_auth: 7.0.1
  google_sign_in: 7.2.0
  crypto: 3.0.8
  firebase_analytics: 13.0.1
  firebase_remote_config: 7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  assets:
    - assets/icons/
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
